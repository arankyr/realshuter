<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="msapplication-TileColor" content="#000000">
<meta name="theme-color" content="#000000">
<title>Lumia Station</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: "Segoe UI", "Segoe WP", Roboto, Arial, sans-serif;
    -ms-touch-action: manipulation; touch-action: manipulation;
    -ms-user-select: none; -webkit-user-select: none; user-select: none; }
  .pantalla { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; -ms-flex-direction: column; -webkit-flex-direction: column; flex-direction: column;
    -ms-flex-pack: center; -webkit-justify-content: center; justify-content: center;
    -ms-flex-align: center; -webkit-align-items: center; align-items: center; text-align: center; padding: 4vw; }
  .pantalla.activa { display: -ms-flexbox; display: -webkit-flex; display: flex; }

  /* Botón de menú en la esquina */
  #btnMenu { position: absolute; top: 0; right: 0; width: 64px; height: 64px; z-index: 50;
    background: transparent; border: 0; color: #fff; font-size: 30px; opacity: .25; }
  #btnMenu:active { opacity: 1; }

  /* Menú */
  #menu { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
    background: rgba(0,0,0,.94); overflow-y: auto; padding: 16px; }
  #menu.abierto { display: block; }
  #menu h1 { font-weight: 300; font-size: 28px; margin: 8px 4px 16px; }
  .opcion { display: block; width: 100%; padding: 18px 16px; margin-bottom: 8px; border: 0;
    background: #1a1a1a; color: #fff; font-size: 22px; text-align: left; font-family: inherit; }
  .opcion:active { background: #0078d7; }
  .opcion .ico { display: inline-block; width: 40px; }

  button.grande { font-family: inherit; font-size: 7vw; padding: 3vw 6vw; margin: 2vw; border: 2px solid #fff;
    background: transparent; color: #fff; min-width: 30vw; }
  button.grande:active { background: #fff; color: #000; }
  button.chico { font-family: inherit; font-size: 5vw; padding: 2vw 4vw; margin: 1vw; border: 1px solid #666;
    background: #111; color: #fff; }
  .fila { margin: 2vw 0; }

  /* Reloj */
  #hora { font-size: 24vw; font-weight: 200; line-height: 1; letter-spacing: -0.02em; }
  #seg { font-size: 8vw; color: #888; }
  #fecha { font-size: 6vw; color: #aaa; margin-top: 3vw; text-transform: capitalize; }

  /* Clima */
  #climaIco { font-size: 20vw; line-height: 1.1; }
  #climaTemp { font-size: 18vw; font-weight: 200; line-height: 1; }
  #climaDesc { font-size: 6vw; color: #ccc; margin-top: 1vw; }
  #climaExtra { font-size: 4.5vw; color: #888; margin-top: 2vw; }
  #climaDias { margin-top: 5vw; width: 100%; }
  .dia { display: inline-block; width: 24%; font-size: 4.5vw; color: #ccc; vertical-align: top; }
  .dia b { display: block; color: #fff; font-weight: 400; }
  #climaCiudad { font-size: 4.5vw; color: #666; margin-bottom: 2vw; }

  /* Cronómetro / temporizador */
  .numGrande { font-size: 20vw; font-weight: 200; line-height: 1.1; }
  .alarma { -webkit-animation: parpadeo .5s infinite; animation: parpadeo .5s infinite; }
  @-webkit-keyframes parpadeo { 50% { background: #c00; } }
  @keyframes parpadeo { 50% { background: #c00; } }

  /* Rociador */
  #rocEstado { font-size: 5vw; color: #aaa; margin-top: 4vw; min-height: 6vw; }

  /* Config */
  #pConfig { -ms-flex-pack: start; -webkit-justify-content: flex-start; justify-content: flex-start;
    text-align: left; -ms-flex-align: stretch; -webkit-align-items: stretch; align-items: stretch; overflow-y: auto; }
  #pConfig h2 { font-weight: 300; font-size: 26px; margin: 8px 0 12px; }
  #pConfig label { display: block; font-size: 16px; color: #aaa; margin-top: 12px; }
  #pConfig input, #pConfig select { width: 100%; font-size: 20px; padding: 8px; background: #111; color: #fff;
    border: 1px solid #555; font-family: inherit; margin-top: 4px; }
  #pConfig .nota { font-size: 14px; color: #777; margin-top: 4px; }
  #cfgGuardado { color: #6c6; font-size: 16px; margin-top: 8px; min-height: 20px; }
</style>
</head>
<body>

<button id="btnMenu" aria-label="Menú">&#9776;</button>

<!-- ===== MENÚ ===== -->
<div id="menu">
  <h1>Lumia Station</h1>
  <button class="opcion" data-ir="pReloj"><span class="ico">&#128344;</span>Reloj</button>
  <button class="opcion" data-ir="pClima"><span class="ico">&#9925;</span>Clima</button>
  <button class="opcion" data-ir="pCrono"><span class="ico">&#9201;</span>Cronómetro</button>
  <button class="opcion" data-ir="pTimer"><span class="ico">&#9203;</span>Temporizador</button>
  <button class="opcion" data-ir="pLampara"><span class="ico">&#128161;</span>Lámpara</button>
  <button class="opcion" data-ir="pRociador"><span class="ico">&#128167;</span>Rociador</button>
  <button class="opcion" data-ir="pConfig"><span class="ico">&#9881;</span>Configuración</button>
  <button class="opcion" id="btnFS"><span class="ico">&#9974;</span>Pantalla completa</button>
</div>

<!-- ===== RELOJ ===== -->
<div class="pantalla" id="pReloj">
  <div><span id="hora">--:--</span><span id="seg"></span></div>
  <div id="fecha"></div>
</div>

<!-- ===== CLIMA ===== -->
<div class="pantalla" id="pClima">
  <div id="climaCiudad"></div>
  <div id="climaIco">&#8230;</div>
  <div id="climaTemp">--&deg;</div>
  <div id="climaDesc">Cargando...</div>
  <div id="climaExtra"></div>
  <div id="climaDias"></div>
</div>

<!-- ===== CRONÓMETRO ===== -->
<div class="pantalla" id="pCrono">
  <div class="numGrande" id="cronoTxt">00:00.0</div>
  <div class="fila">
    <button class="grande" id="cronoBtn">Iniciar</button>
    <button class="grande" id="cronoReset">Reset</button>
  </div>
</div>

<!-- ===== TEMPORIZADOR ===== -->
<div class="pantalla" id="pTimer">
  <div class="numGrande" id="timerTxt">05:00</div>
  <div class="fila">
    <button class="chico" data-sumar="-60">-1m</button>
    <button class="chico" data-sumar="60">+1m</button>
    <button class="chico" data-sumar="300">+5m</button>
    <button class="chico" data-sumar="600">+10m</button>
  </div>
  <div class="fila">
    <button class="grande" id="timerBtn">Iniciar</button>
    <button class="grande" id="timerReset">Reset</button>
  </div>
</div>

<!-- ===== LÁMPARA ===== -->
<div class="pantalla" id="pLampara" style="background:#ffe4b5"></div>

<!-- ===== ROCIADOR ===== -->
<div class="pantalla" id="pRociador">
  <button class="grande" id="rocBtn" style="font-size:12vw;padding:6vw 10vw">&#128167; Rociar</button>
  <div id="rocEstado"></div>
</div>

<!-- ===== CONFIGURACIÓN ===== -->
<div class="pantalla" id="pConfig">
  <h2>Configuración</h2>
  <label>Ciudad (solo el nombre que se muestra)</label>
  <input id="cfgCiudad" type="text">
  <label>Latitud</label>
  <input id="cfgLat" type="text">
  <label>Longitud</label>
  <input id="cfgLon" type="text">
  <label>Formato de hora</label>
  <select id="cfgFormato"><option value="24">24 hs</option><option value="12">12 hs</option></select>
  <label>Mostrar segundos en el reloj</label>
  <select id="cfgSeg"><option value="1">Sí</option><option value="0">No</option></select>
  <label>URL del rociador (acción rociar)</label>
  <input id="cfgRoc" type="text" placeholder="http://192.168.0.50/rociar">
  <div class="nota">Usá la IP, no rociador.local. Si esta página está en https (GitHub Pages), el navegador puede bloquear el pedido a http.</div>
  <label>Pantalla al abrir</label>
  <select id="cfgInicio">
    <option value="pReloj">Reloj</option><option value="pClima">Clima</option>
    <option value="pCrono">Cronómetro</option><option value="pTimer">Temporizador</option>
    <option value="pLampara">Lámpara</option><option value="pRociador">Rociador</option>
    <option value="ultima">La última que usé</option>
  </select>
  <div class="fila"><button class="chico" id="cfgGuardar">Guardar</button></div>
  <div id="cfgGuardado"></div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- utilidades ---------- */
  function $(id) { return document.getElementById(id); }
  function dos(n) { return n < 10 ? "0" + n : "" + n; }
  function cada(lista, fn) { for (var i = 0; i < lista.length; i++) fn(lista[i], i); }
  function tocar(el, fn) { el.addEventListener("click", fn, false); }

  var DEF = { ciudad: "Buenos Aires", lat: "-34.6037", lon: "-58.3816", formato: "24", seg: "1",
              roc: "", inicio: "pReloj", ultima: "pReloj" };
  var cfg = {};
  function cargarCfg() {
    var g = null;
    try { g = JSON.parse(localStorage.getItem("lumiaStation") || "null"); } catch (e) {}
    for (var k in DEF) { if (DEF.hasOwnProperty(k)) cfg[k] = (g && g[k] !== undefined) ? g[k] : DEF[k]; }
  }
  function guardarCfg() { try { localStorage.setItem("lumiaStation", JSON.stringify(cfg)); } catch (e) {} }
  cargarCfg();

  /* ---------- navegación ---------- */
  var actual = null;
  var alSalir = {}, alEntrar = {};

  function ir(id) {
    if (actual && alSalir[actual]) alSalir[actual]();
    cada(document.querySelectorAll(".pantalla"), function (p) { p.className = p.className.replace(" activa", ""); });
    $(id).className += " activa";
    actual = id;
    if (alEntrar[id]) alEntrar[id]();
    if (id !== "pConfig") { cfg.ultima = id; guardarCfg(); }
    cerrarMenu();
  }
  function abrirMenu() { $("menu").className = "abierto"; }
  function cerrarMenu() { $("menu").className = ""; }

  tocar($("btnMenu"), function () {
    if ($("menu").className === "abierto") cerrarMenu(); else abrirMenu();
  });
  cada(document.querySelectorAll("[data-ir]"), function (b) {
    tocar(b, function () { ir(b.getAttribute("data-ir")); pantallaCompleta(); });
  });

  function pantallaCompleta() {
    var d = document.documentElement;
    var f = d.requestFullscreen || d.webkitRequestFullscreen || d.msRequestFullscreen || d.mozRequestFullScreen;
    if (f) { try { f.call(d); } catch (e) {} }
  }
  tocar($("btnFS"), function () { pantallaCompleta(); cerrarMenu(); });

  /* ---------- RELOJ ---------- */
  var DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  var MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto",
               "septiembre", "octubre", "noviembre", "diciembre"];
  function tickReloj() {
    var d = new Date(), h = d.getHours(), suf = "";
    if (cfg.formato === "12") { suf = h < 12 ? " am" : " pm"; h = h % 12; if (h === 0) h = 12; }
    $("hora").innerHTML = (cfg.formato === "12" ? h : dos(h)) + ":" + dos(d.getMinutes());
    $("seg").innerHTML = (cfg.seg === "1" ? ":" + dos(d.getSeconds()) : "") + suf;
    $("fecha").innerHTML = DIAS[d.getDay()] + " " + d.getDate() + " de " + MESES[d.getMonth()];
  }
  tickReloj();
  setInterval(tickReloj, 1000);
  tocar($("pReloj"), abrirMenu);

  /* ---------- CLIMA (Open-Meteo, sin API key) ---------- */
  var CODIGOS = {
    0: ["Despejado", "\u2600"], 1: ["Mayormente despejado", "\uD83C\uDF24"], 2: ["Parcialmente nublado", "\u26C5"],
    3: ["Nublado", "\u2601"], 45: ["Niebla", "\uD83C\uDF2B"], 48: ["Niebla", "\uD83C\uDF2B"],
    51: ["Llovizna", "\uD83C\uDF26"], 53: ["Llovizna", "\uD83C\uDF26"], 55: ["Llovizna fuerte", "\uD83C\uDF26"],
    56: ["Llovizna helada", "\uD83C\uDF27"], 57: ["Llovizna helada", "\uD83C\uDF27"],
    61: ["Lluvia leve", "\uD83C\uDF27"], 63: ["Lluvia", "\uD83C\uDF27"], 65: ["Lluvia fuerte", "\uD83C\uDF27"],
    66: ["Lluvia helada", "\uD83C\uDF27"], 67: ["Lluvia helada", "\uD83C\uDF27"],
    71: ["Nieve", "\u2744"], 73: ["Nieve", "\u2744"], 75: ["Nieve fuerte", "\u2744"], 77: ["Nieve", "\u2744"],
    80: ["Chaparrones", "\uD83C\uDF26"], 81: ["Chaparrones", "\uD83C\uDF26"], 82: ["Chaparrones fuertes", "\u26C8"],
    85: ["Nieve", "\u2744"], 86: ["Nieve", "\u2744"],
    95: ["Tormenta", "\u26C8"], 96: ["Tormenta con granizo", "\u26C8"], 99: ["Tormenta con granizo", "\u26C8"]
  };
  function cod(c) { return CODIGOS[c] || ["", "?"]; }
  var climaUlt = 0;

  function cargarClima() {
    $("climaCiudad").innerHTML = cfg.ciudad;
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + encodeURIComponent(cfg.lat) +
      "&longitude=" + encodeURIComponent(cfg.lon) +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code" +
      "&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=4";
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.timeout = 15000;
    x.onload = function () {
      try {
        var r = JSON.parse(x.responseText), c = r.current, dd = r.daily;
        var k = cod(c.weather_code);
        $("climaIco").innerHTML = k[1];
        $("climaTemp").innerHTML = Math.round(c.temperature_2m) + "&deg;";
        $("climaDesc").innerHTML = k[0];
        $("climaExtra").innerHTML = "Sensación " + Math.round(c.apparent_temperature) + "&deg; &middot; Hum " +
          c.relative_humidity_2m + "% &middot; Viento " + Math.round(c.wind_speed_10m) + " km/h";
        var html = "";
        for (var i = 0; i < dd.time.length; i++) {
          var p = dd.time[i].split("-"), f = new Date(+p[0], +p[1] - 1, +p[2]);
          html += '<div class="dia"><b>' + (i === 0 ? "Hoy" : DIAS[f.getDay()].substr(0, 3)) + "</b>" +
            cod(dd.weather_code[i])[1] + "<br>" + Math.round(dd.temperature_2m_max[i]) + "&deg; / " +
            Math.round(dd.temperature_2m_min[i]) + "&deg;</div>";
        }
        $("climaDias").innerHTML = html;
        climaUlt = new Date().getTime();
      } catch (e) { $("climaDesc").innerHTML = "Error leyendo el clima"; }
    };
    x.onerror = x.ontimeout = function () { $("climaDesc").innerHTML = "Sin conexión con el servicio de clima"; };
    x.send();
  }
  alEntrar.pClima = function () { if (new Date().getTime() - climaUlt > 10 * 60 * 1000) cargarClima(); };
  setInterval(function () { if (actual === "pClima") cargarClima(); }, 15 * 60 * 1000);
  tocar($("pClima"), abrirMenu);

  /* ---------- CRONÓMETRO ---------- */
  var cronoIni = 0, cronoAcum = 0, cronoInt = null;
  function cronoMs() { return cronoAcum + (cronoInt ? new Date().getTime() - cronoIni : 0); }
  function cronoPintar() {
    var ms = cronoMs(), t = Math.floor(ms / 100), d = t % 10, s = Math.floor(t / 10);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    $("cronoTxt").innerHTML = (h ? h + ":" : "") + dos(m) + ":" + dos(s % 60) + "." + d;
  }
  tocar($("cronoBtn"), function () {
    if (cronoInt) { cronoAcum = cronoMs(); clearInterval(cronoInt); cronoInt = null; this.innerHTML = "Seguir"; }
    else { cronoIni = new Date().getTime(); cronoInt = setInterval(cronoPintar, 100); this.innerHTML = "Pausa"; }
  });
  tocar($("cronoReset"), function () {
    if (cronoInt) { clearInterval(cronoInt); cronoInt = null; }
    cronoAcum = 0; cronoPintar(); $("cronoBtn").innerHTML = "Iniciar";
  });

  /* ---------- TEMPORIZADOR ---------- */
  var timerTotal = 300, timerResta = 300, timerFin = 0, timerInt = null, ctxAudio = null, beepInt = null;
  function timerPintar() {
    var s = Math.max(0, Math.ceil(timerResta));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    $("timerTxt").innerHTML = (h ? h + ":" : "") + dos(m) + ":" + dos(s % 60);
  }
  function beep() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!ctxAudio) ctxAudio = new AC();
      var o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctxAudio.destination);
      g.gain.value = 0.3; o.start(0); o.stop(ctxAudio.currentTime + 0.3);
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate(300); } catch (e) {}
  }
  function timerAlarma(on) {
    var p = $("pTimer");
    if (on) { p.className += " alarma"; beep(); beepInt = setInterval(beep, 1000); }
    else { p.className = p.className.replace(" alarma", ""); if (beepInt) { clearInterval(beepInt); beepInt = null; } }
  }
  function timerParar() { if (timerInt) { clearInterval(timerInt); timerInt = null; } }
  tocar($("timerBtn"), function () {
    timerAlarma(false);
    if (timerInt) { timerParar(); this.innerHTML = "Seguir"; return; }
    if (timerResta <= 0) timerResta = timerTotal;
    timerFin = new Date().getTime() + timerResta * 1000;
    this.innerHTML = "Pausa";
    timerInt = setInterval(function () {
      timerResta = (timerFin - new Date().getTime()) / 1000;
      if (timerResta <= 0) { timerResta = 0; timerParar(); $("timerBtn").innerHTML = "Iniciar"; timerAlarma(true); }
      timerPintar();
    }, 200);
  });
  tocar($("timerReset"), function () {
    timerParar(); timerAlarma(false); timerResta = timerTotal; timerPintar(); $("timerBtn").innerHTML = "Iniciar";
  });
  cada(document.querySelectorAll("[data-sumar]"), function (b) {
    tocar(b, function () {
      if (timerInt) return;
      timerTotal = Math.max(10, timerTotal + parseInt(b.getAttribute("data-sumar"), 10));
      timerResta = timerTotal; timerPintar();
    });
  });
  timerPintar();

  /* ---------- LÁMPARA ---------- */
  var COLORES = ["#ffe4b5", "#ffffff", "#ff3b30", "#0078d7", "#30d158", "#ff9f0a", "#000000"];
  var colorI = 0;
  tocar($("pLampara"), function () {
    colorI = (colorI + 1) % COLORES.length;
    $("pLampara").style.background = COLORES[colorI];
  });

  /* ---------- ROCIADOR ---------- */
  tocar($("rocBtn"), function () {
    var est = $("rocEstado");
    if (!cfg.roc) { est.innerHTML = "Configurá la URL en Configuración"; return; }
    est.innerHTML = "Enviando...";
    var x = new XMLHttpRequest();
    try {
      x.open("GET", cfg.roc + (cfg.roc.indexOf("?") < 0 ? "?" : "&") + "t=" + new Date().getTime(), true);
      x.timeout = 8000;
      x.onload = function () { est.innerHTML = (x.status >= 200 && x.status < 400) ? "&#10003; Listo" : "Error " + x.status; };
      x.onerror = function () { est.innerHTML = "No responde (¿IP correcta? ¿misma red? ¿https bloqueando http?)"; };
      x.ontimeout = function () { est.innerHTML = "Tardó demasiado"; };
      x.send();
    } catch (e) { est.innerHTML = "El navegador bloqueó el pedido"; }
  });

  /* ---------- CONFIGURACIÓN ---------- */
  alEntrar.pConfig = function () {
    $("cfgCiudad").value = cfg.ciudad; $("cfgLat").value = cfg.lat; $("cfgLon").value = cfg.lon;
    $("cfgFormato").value = cfg.formato; $("cfgSeg").value = cfg.seg; $("cfgRoc").value = cfg.roc;
    $("cfgInicio").value = cfg.inicio; $("cfgGuardado").innerHTML = "";
  };
  tocar($("cfgGuardar"), function () {
    cfg.ciudad = $("cfgCiudad").value || DEF.ciudad;
    cfg.lat = ($("cfgLat").value || DEF.lat).replace(",", ".");
    cfg.lon = ($("cfgLon").value || DEF.lon).replace(",", ".");
    cfg.formato = $("cfgFormato").value; cfg.seg = $("cfgSeg").value;
    cfg.roc = $("cfgRoc").value.replace(/^\s+|\s+$/g, "");
    cfg.inicio = $("cfgInicio").value;
    guardarCfg(); climaUlt = 0; tickReloj();
    $("cfgGuardado").innerHTML = "&#10003; Guardado";
  });

  /* ---------- arranque ---------- */
  var inicio = cfg.inicio === "ultima" ? cfg.ultima : cfg.inicio;
  ir($(inicio) ? inicio : "pReloj");
})();
</script>
</body>
</html>
